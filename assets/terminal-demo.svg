<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes show {
        from { visibility: hidden; }
        to   { visibility: visible; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .l00 { visibility: hidden; animation: show 0s 0.5s forwards; }
      .l01 { visibility: hidden; animation: show 0s 1.6s forwards; }
      .l02 { visibility: hidden; animation: show 0s 1.8s forwards; }
      .l03 { visibility: hidden; animation: show 0s 2.0s forwards; }

      .l10 { visibility: hidden; animation: show 0s 2.8s forwards; }
      .l11 { visibility: hidden; animation: show 0s 3.9s forwards; }

      .l20 { visibility: hidden; animation: show 0s 4.7s forwards; }
      .l21 { visibility: hidden; animation: show 0s 5.8s forwards; }
      .l22 { visibility: hidden; animation: show 0s 6.0s forwards; }
      .l23 { visibility: hidden; animation: show 0s 6.2s forwards; }
      .l24 { visibility: hidden; animation: show 0s 6.4s forwards; }

      .l30 { visibility: hidden; animation: show 0s 7.2s forwards; }
      .l31 { visibility: hidden; animation: show 0s 8.3s forwards; }
      .l32 { visibility: hidden; animation: show 0s 8.5s forwards; }
      .l33 { visibility: hidden; animation: show 0s 8.7s forwards; }

      .cursor { animation: blink 1s infinite; }

      text { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect width="800" height="480" rx="12" fill="#1e1e1e"/>

  <!-- Title bar -->
  <rect width="800" height="42" rx="12" fill="#2d2d2d"/>
  <rect y="30" width="800" height="12" fill="#2d2d2d"/>

  <!-- macOS traffic-light buttons -->
  <circle cx="22" cy="21" r="7" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="7" fill="#28c840"/>

  <!-- Terminal title -->
  <text x="400" y="27" text-anchor="middle" fill="#999" font-size="13" font-weight="500">rustkvd-cli — terminal</text>

  <!-- ======= BLOCK 1: put ======= -->
  <!-- prompt line -->
  <text class="l00" x="24" y="80" font-size="13" fill="#aaa">$</text>
  <text class="l00" x="38" y="80" font-size="13" fill="#e6edf3">rustkvd-cli --peers localhost:7001 put user:1001 </text>
  <text class="l00" x="530" y="80" font-size="13" fill="#f7c948">'{"name":"Alice","role":"admin"}'</text>
  <!-- output -->
  <text class="l01" x="24" y="103" font-size="13" fill="#4CAF50">OK</text>
  <text class="l02" x="54" y="103" font-size="13" fill="#8b949e">(version:</text>
  <text class="l03" x="132" y="103" font-size="13" fill="#f7c948">42)</text>

  <!-- spacer line indicator -->
  <line class="l03" x1="24" y1="115" x2="776" y2="115" stroke="#30363d" stroke-width="0.5"/>

  <!-- ======= BLOCK 2: get ======= -->
  <text class="l10" x="24" y="138" font-size="13" fill="#aaa">$</text>
  <text class="l10" x="38" y="138" font-size="13" fill="#e6edf3">rustkvd-cli --peers localhost:7001 get user:1001</text>
  <!-- output -->
  <text class="l11" x="24" y="161" font-size="13" fill="#4CAF50">{"name":"Alice","role":"admin"}</text>

  <line class="l11" x1="24" y1="173" x2="776" y2="173" stroke="#30363d" stroke-width="0.5"/>

  <!-- ======= BLOCK 3: status ======= -->
  <text class="l20" x="24" y="196" font-size="13" fill="#aaa">$</text>
  <text class="l20" x="38" y="196" font-size="13" fill="#e6edf3">rustkvd-cli --peers localhost:7001 status</text>
  <!-- output lines -->
  <text class="l21" x="24" y="219" font-size="12.5" fill="#e6edf3">Node: <tspan fill="#ff6b35">node1</tspan>  |  Role: <tspan fill="#ff6b35">leader</tspan>  |  Term: <tspan fill="#f7c948">3</tspan>  |  Leader: <tspan fill="#ff6b35">node1</tspan></text>
  <text class="l22" x="24" y="238" font-size="12.5" fill="#e6edf3">Committed: <tspan fill="#4CAF50">1247</tspan>  |  Applied: <tspan fill="#4CAF50">1247</tspan></text>
  <text class="l23" x="24" y="257" font-size="12.5" fill="#e6edf3">Peers: <tspan fill="#4A90D9">["localhost:7002", "localhost:7003"]</tspan></text>
  <line class="l24" x1="24" y1="270" x2="776" y2="270" stroke="#30363d" stroke-width="0.5"/>

  <!-- ======= BLOCK 4: scan ======= -->
  <text class="l30" x="24" y="293" font-size="13" fill="#aaa">$</text>
  <text class="l30" x="38" y="293" font-size="13" fill="#e6edf3">rustkvd-cli --peers localhost:7001 scan --prefix <tspan fill="#f7c948">"user:"</tspan> --limit 5</text>
  <!-- output -->
  <text class="l31" x="24" y="316" font-size="12.5" fill="#8b949e">user:1001</text>
  <text class="l31" x="110" y="316" font-size="12.5" fill="#30363d">=&gt;</text>
  <text class="l31" x="130" y="316" font-size="12.5" fill="#4CAF50">{"name":"Alice","role":"admin"}</text>

  <text class="l32" x="24" y="335" font-size="12.5" fill="#8b949e">user:1002</text>
  <text class="l32" x="110" y="335" font-size="12.5" fill="#30363d">=&gt;</text>
  <text class="l32" x="130" y="335" font-size="12.5" fill="#4CAF50">{"name":"Bob","role":"viewer"}</text>

  <text class="l33" x="24" y="354" font-size="12.5" fill="#8b949e">user:1003</text>
  <text class="l33" x="110" y="354" font-size="12.5" fill="#30363d">=&gt;</text>
  <text class="l33" x="130" y="354" font-size="12.5" fill="#4CAF50">{"name":"Carol","role":"editor"}</text>

  <!-- Blinking cursor (shown at end) -->
  <rect class="cursor" x="24" y="372" width="8" height="16" fill="#e6edf3" rx="1"/>

  <!-- Bottom info bar -->
  <rect x="0" y="450" width="800" height="30" fill="#2d2d2d" rx="0"/>
  <rect x="0" y="450" width="800" height="30" fill="#2d2d2d"/>
  <rect x="0" y="462" width="800" height="18" fill="#2d2d2d"/>
  <rect x="0" y="450" width="800" height="30" rx="0" fill="#2d2d2d"/>
  <text x="24" y="470" font-size="11" fill="#666">rustkvd v0.1.0</text>
  <text x="400" y="470" text-anchor="middle" font-size="11" fill="#666">github.com/vignesh2027/rustkvd</text>
  <text x="776" y="470" text-anchor="end" font-size="11" fill="#666">MIT License</text>
</svg>
