syntax = "proto3";
package kvstore;

service KVStore {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Watch(WatchRequest) returns (stream WatchEvent);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc NodeStatus(StatusRequest) returns (StatusResponse);
}

service RaftInternal {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc InstallSnapshot(SnapshotRequest) returns (SnapshotResponse);
}

message GetRequest {
  string key = 1;
  uint64 version = 2;
}

message GetResponse {
  bytes value = 1;
  uint64 version = 2;
  bool found = 3;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  uint64 ttl_secs = 3;
}

message PutResponse {
  uint64 version = 1;
  bool success = 2;
  string leader_hint = 3;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message WatchRequest {
  string key_prefix = 1;
}

message WatchEvent {
  string key = 1;
  bytes value = 2;
  string event_type = 3;
}

message ScanRequest {
  string start_key = 1;
  string end_key = 2;
  uint32 limit = 3;
}

message KeyValue {
  string key = 1;
  bytes value = 2;
  uint64 version = 3;
}

message ScanResponse {
  repeated KeyValue pairs = 1;
}

message StatusRequest {}

message StatusResponse {
  string node_id = 1;
  string role = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 committed_index = 5;
  uint64 applied_index = 6;
  repeated string peers = 7;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes data = 3;
  string entry_type = 4;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message SnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  uint64 offset = 6;
  bool done = 7;
}

message SnapshotResponse {
  uint64 term = 1;
}
