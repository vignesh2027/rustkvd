[workspace]
members = [
    "crates/common",
    "crates/storage",
    "crates/raft",
    "crates/cluster",
    "crates/server",
    "crates/client",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
prost = "0.12"
serde = { version = "1", features = ["derive"] }
bincode = "1"
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
crc32fast = "1"
dashmap = "5"
parking_lot = "0.12"
rand = "0.8"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tempfile = "3"
tonic-build = "0.11"

[profile.release]
opt-level = 3
lto = true
